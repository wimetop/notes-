services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notes_plus
      POSTGRES_USER: notes_plus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes_plus -d notes_plus"]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
  migrate:
    build:
      context: .
      target: migrate
    environment: &app_env
      DATABASE_URL: postgresql://notes_plus:${POSTGRES_PASSWORD}@postgres:5432/notes_plus
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
      TRASH_TTL_DAYS: "30"
      CRON_PURGE_SCHEDULE: "0 3 * * *"
      PORT: "3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    build: .
    environment: *app_env
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://' + process.env.HOSTNAME + ':3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  worker:
    build: .
    environment: *app_env
    command: ["node", "dist/worker/index.mjs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
